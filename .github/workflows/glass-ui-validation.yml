name: Glass UI validation (no deployment)
on:
  push:
    branches: [feat/glass-charts-system-20260907]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies without application scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package isolated validation dependencies
        run: tar -czf ui-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ui-dependencies
          path: ui-dependencies.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
