name: Security Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 12 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency and secret checks
        run: npm run security:check
