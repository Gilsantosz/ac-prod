    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- ─── Viewport e Mobile ──────────────────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />

    <!-- ─── PWA / iOS ──────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#005f2f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Leo Flow" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/icon-192-v2.png" />

    <!-- ─── Theme / Brand ──────────────────────────────────────────────── -->
    <meta name="application-name" content="Leo Flow" />
    <meta name="msapplication-TileColor" content="#005f2f" />

    <!-- ─── SEO / OG ───────────────────────────────────────────────────── -->
    <meta name="description" content="Sistema MES de controle e apontamento de produção industrial. Registre produções por célula e turno, acompanhe OEE e gere relatórios." />
    <meta property="og:title" content="Leo Flow — Controle de Produção" />
    <meta property="og:description" content="Sistema MES industrial para gestão de produção por célula e turno." />
    <meta property="og:type" content="website" />

    <!-- ─── Favicon e Manifest ─────────────────────────────────────────── -->
    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192-v2.png" />
    <!-- O manifest é injetado automaticamente pelo vite-plugin-pwa -->

    <title>Leo Flow — Controle de Produção</title>

    <!-- ─── Auto-limpeza de Service Worker desatualizado ─────────────── -->
    <script>
      // Versão atual do manifest — incrementar a cada mudança de manifest
      var MANIFEST_VERSION = '1.4.0-standalone-wco';
      var storedVersion = localStorage.getItem('lf_manifest_version');
      if (storedVersion !== MANIFEST_VERSION) {
        localStorage.setItem('lf_manifest_version', MANIFEST_VERSION);
        // Cancela todos os service workers antigos e recarrega a página
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            var promises = registrations.map(function(r) { return r.unregister(); });
            return Promise.all(promises);
          }).then(function() {
            // Limpa caches do workbox
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) { caches.delete(name); });
              });
            }
            // Força reload apenas se houve mudança de versão (não na primeira visita)
            if (storedVersion) {
              window.location.reload(true);
            }
          });
        }
      }
    </script>

    <!-- ─── SPA Routing: GitHub Pages redirect ─────────────────────────── -->
    <script>
      // Single Page Apps for GitHub Pages: decodifica redirecionamento vindo de 404.html
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      }(window.location));
    </script>

    <!-- ─── Performance: preconnect ao Supabase ────────────────────────── -->
    <link rel="preconnect" href="https://uozuzdfvnufsjsonswag.supabase.co" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
