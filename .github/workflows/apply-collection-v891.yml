name: Apply AC.Prod collection v8.9.1 patch

on:
  push:
    branches: [fix/collection-sync-v8-9-1]

permissions:
  contents: write

concurrency:
  group: apply-collection-v891
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/collection-sync-v8-9-1
          fetch-depth: 0

      - name: Validar e aplicar patch
        run: |
          set -euo pipefail
          cat .acprod-patch-v891/part_* > /tmp/acprod-v891.b64
          base64 --decode /tmp/acprod-v891.b64 > /tmp/acprod-v891.zip
          echo "0c3224af5c161d88fbb193701bb3017c50cb243a04fbee26e72a357362417531  /tmp/acprod-v891.zip" | sha256sum --check -
          unzip -o /tmp/acprod-v891.zip -d .
          rm -rf .acprod-patch-v891
          rm -f .github/workflows/apply-collection-v891.yml

      - name: Commitar correção
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(collection): sincronismo assíncrono v8.9.1"
          git push origin HEAD:fix/collection-sync-v8-9-1
