name: Charts UI — isolated visual validation
on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'scripts/chart*', 'scripts/testChartModel.mjs', 'tests/fixtures/chart-glass*', 'vite.config.js', 'vitest.config.js', '.github/workflows/charts-ui.yml']
permissions:
  contents: read
jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/testChartModel.mjs
      - run: npx vitest run src/components/charts/recharts.test.jsx src/components/dashboard/chartRendering.test.jsx
      - name: Build without production credentials
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser checks, synthetic fixture only
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/chart-vite.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5173/tests/fixtures/chart-glass.html >/dev/null && break; sleep 1; done
          node scripts/chartBrowserCheck.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: charts-glass-visual-validation
          path: artifacts/charts-glass-*.png
          if-no-files-found: warn
