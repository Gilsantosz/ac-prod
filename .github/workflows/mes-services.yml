name: Validar camadas MES
on:
  push:
    paths: ['services/**', 'supabase/migrations/*mes*.sql', '.github/workflows/mes-services.yml']
  pull_request:
    paths: ['services/**', 'supabase/migrations/*mes*.sql', '.github/workflows/mes-services.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/mes-api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/mes-api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --test test/integration.mjs
        env:
          MES_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t mes-api:validation .
  dashboard-and-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/mes-dashboard/requirements.txt
      - run: pip install -r services/mes-dashboard/requirements.txt
      - run: python -m unittest discover -s services/mes-dashboard/tests
      - run: python services/tests/verify_database.py
        env:
          MES_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Criar banco vazio exclusivo para aprendizado de ciclo
        env:
          MES_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          python - <<'PY'
          import os
          import psycopg2

          connection = psycopg2.connect(os.environ['MES_TEST_DATABASE_URL'])
          connection.autocommit = True
          try:
              with connection.cursor() as cursor:
                  cursor.execute('CREATE DATABASE mes_cycle_learning_test TEMPLATE template0')
          finally:
              connection.close()
          PY
      - name: Validar aprendizado de ciclo no banco isolado
        run: python services/tests/verify_cycle_learning.py
        env:
          MES_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/mes_cycle_learning_test
      - run: docker build -t mes-dashboard:validation services/mes-dashboard
