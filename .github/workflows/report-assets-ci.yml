name: Report branding and browser exports
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  report-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Read public deployment assets
        run: |
          python3 - <<'PY'
          import urllib.request,json,pathlib,subprocess
          pathlib.Path('.report-smoke-output').mkdir(exist_ok=True)
          subprocess.run(['git','archive','--format=tar','HEAD','-o','.report-smoke-output/source.tar'],check=True)
          for path in ['build-info.json','assets/leo-madeiras-logo-CfJe40-o.jpg']:
              try:
                  r=urllib.request.urlopen('https://gilsantosz.github.io/ac-prod/'+path,timeout=20)
                  b=r.read()
                  print('DEPLOYED_ASSET',path,r.status,r.headers.get('Content-Type'),len(b),b[:16].hex())
                  if path.endswith('.json'): print('DEPLOYED_VERSION',b.decode())
              except Exception as e: print('DEPLOYED_ASSET_ERROR',path,str(e))
          PY
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser regression
        run: node scripts/report-assets-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-assets-validation
          path: .report-smoke-output/
          include-hidden-files: true
          retention-days: 7
