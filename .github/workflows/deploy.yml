name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  migrate:
    name: Database Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Migrations
        run: |
          if [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && [ -n "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            PROJECT_REF="${{ secrets.SUPABASE_PROJECT_ID }}"
            if [ -z "$PROJECT_REF" ]; then
              PROJECT_REF="uozuzdfvnufsjsonswag"
            fi
            supabase db push --project-ref "$PROJECT_REF"
            for function_name in \
              send-report-email \
              sendDailyClosure \
              schedule-report-job \
              admin-users \
              promob-parse-order \
              promob-api-sync \
              generate-productive-backup \
              sync-google-drive-archive
            do
              supabase functions deploy "$function_name" --project-ref "$PROJECT_REF"
            done
            # Estes endpoints possuem autenticação própria: segredo de cron ou
            # recuperação pública com rate limit e resposta anti-enumeração.
            for function_name in \
              send-scheduled-reports \
              recover-password
            do
              supabase functions deploy "$function_name" --no-verify-jwt --project-ref "$PROJECT_REF"
            done
          else
            echo "Aviso: Segredos Supabase (SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD) nao configurados no GitHub. Pulando migracao automatica."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # GitHub Pages publica este repositório em /ac-prod/.
          # O default do Vite agora é / para Cloudflare Pages e domínio próprio.
          VITE_APP_BASE: /ac-prod/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, migrate]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
