name: Apply async collection front patch

on:
  push:
    branches:
      - fix/collection-async-worker-v8-7

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/collection-async-worker-v8-7
          fetch-depth: 0
      - name: Aplicar patch idempotente
        run: python3 scripts/patch_traceability_async_feedback.py
      - name: Publicar alteração gerada
        run: |
          if git diff --quiet; then
            echo "PATCH_ALREADY_APPLIED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/TraceabilityCollection.jsx
          git commit -m "fix(collection): aguarda decisão final do worker assíncrono"
          git push origin HEAD:fix/collection-async-worker-v8-7
