name: Apply collection async v8.8 patch

on:
  push:
    branches:
      - fix/collection-async-sync-v8-8

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/collection-async-sync-v8-8
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 scripts/apply_collection_v88_patch.py
      - name: Commit patched files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/deploy.yml
          if git diff --cached --quiet; then
            echo "No patch changes were produced."
            exit 0
          fi
          git commit -m "fix(collection): conclui sincronismo assíncrono v8.8"
          git push origin HEAD:fix/collection-async-sync-v8-8
