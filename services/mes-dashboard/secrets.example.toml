# Exemplo sem credenciais. O arquivo real .streamlit/secrets.toml é privado.
# Em containers, DATABASE_URL e MES_DASHBOARD_PASSWORD vêm do ambiente.
MES_DASHBOARD_PASSWORD = "SUBSTITUIR_POR_UM_SEGREDO_FORTE"

[connections.postgresql]
dialect = "postgresql"
host = "db.SEU_PROJETO.supabase.co"
port = 5432
database = "postgres"
username = "mes_leitura"
password = "SUBSTITUIR_PELA_SENHA_DE_LEITURA"
sslrootcert = "supabase-ca.crt"

# Em infraestrutura apenas IPv4, usar o host do Session Pooler na porta 5432
# e seu usuário completo, obtidos da configuração real do projeto Supabase.
