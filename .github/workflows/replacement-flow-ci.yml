name: Validate replacement flow

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/fix-replacement-export-flow

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Diagnose clean build
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch agent/fix-replacement-export-flow https://github.com/Gilsantosz/ac-prod.git repo
          cd repo
          npm ci --silent
          npm run build
