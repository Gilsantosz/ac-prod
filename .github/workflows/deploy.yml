name: Deploy AC.Prod2 — contrato banco/front no mesmo release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  EXPECTED_PROJECT_ID: uozuzdfvnufsjsonswag
  REQUIRED_MIGRATION_VERSION: "20260831150725"
  REQUIRED_RELEASE_VERSION: "20260831_acprod_collection_fast8_v8_5"
  REQUIRED_ASYNC_COLLECTION_MIGRATION_VERSION: "v8.8"
  REQUIRED_ASYNC_COLLECTION_RELEASE_VERSION: "20260831_acprod_collection_async_sync_v8_8"
  REQUIRED_SYNC_MIGRATION_VERSION: "20260831230439"
  REQUIRED_SYNC_RELEASE_VERSION: "20260831_acprod_collection_sync_v8_9_1"

concurrency:
  group: acprod2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Contrato estático do rollout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Auditar coleta rápida, Realtime, reposição e workflow
        run: python3 scripts/audit_collection_rollout.py --repo .

  quality:
    name: Lint, tipos, testes, segurança e build de validação
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [contract]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências reproduzíveis
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Validar sintaxe do worker Edge local
        run: |
          node --check edge-worker/src/config.mjs
          node --check edge-worker/src/durableMemoryQueue.mjs
          node --check edge-worker/src/supabaseBatchSink.mjs
          node --check edge-worker/src/index.mjs
      - name: Testes unitários
        run: npm run test:unit
      - name: Auditoria de dependências e segredos
        run: npm run security:check
      - name: Build de validação
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          VITE_APP_BASE: /ac-prod/
          VITE_APP_COMMIT_SHA: ${{ github.sha }}
          VITE_APP_BUILD_TIME: ${{ github.run_started_at }}
        run: npm run build

  database-release:
    name: Comprovar release do Supabase
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality]
    steps:
      - name: Validar configuração pública obrigatória
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SUPABASE_URL:-}" ] || missing+=(VITE_SUPABASE_URL)
          [ -n "${SUPABASE_ANON_KEY:-}" ] || missing+=(VITE_SUPABASE_ANON_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'ERRO: segredos obrigatórios ausentes:' >&2
            printf ' %s' "${missing[@]}" >&2
            printf '\nO front-end não será publicado.\n' >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          host = (urlparse(os.environ['SUPABASE_URL']).hostname or '').lower()
          expected = os.environ['EXPECTED_PROJECT_ID'].lower()
          if host != f'{expected}.supabase.co':
              raise SystemExit('ERRO: VITE_SUPABASE_URL não pertence ao projeto AC.Prod2 de produção.')
          PY

      - name: Consultar marcador fail-closed da coleta canônica
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error \
            --request POST \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${SUPABASE_URL}/rest/v1/rpc/get_public_collection_release" \
            > "$response_file"
          python3 - "$response_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if isinstance(payload, list):
              payload = payload[0] if payload else {}
          if not isinstance(payload, dict):
              raise SystemExit('ERRO: marcador canônico retornou formato inválido.')
          expected_migration = os.environ['REQUIRED_MIGRATION_VERSION']
          expected_release = os.environ['REQUIRED_RELEASE_VERSION']
          flags = payload.get('schema_flags') or {}
          required_flags = (
              'shift_columns',
              'cell_lifecycle',
              'active_context',
              'reading_v2',
              'history_compatibility',
              'collection_exact_8_digit_scan',
              'collection_active_tags_8_digits',
              'replacement_quality_role',
              'replacement_decision_rbac',
              'replacement_strict_role_hierarchy',
              'replacement_station_only_approval',
              'replacement_origin_classification',
              'replacement_force_justification_only',
              'replacement_force_adjustment_facts',
              'replacement_force_conflict_safe',
              'replacement_audit_mirror',
              'replacement_station_queue',
              'replacement_canonical_lot_close',
          )
          failures = []
          if payload.get('ready') is not True:
              failures.append('ready=false')
          if str(payload.get('migration_version', '')) != expected_migration:
              failures.append(f"migration={payload.get('migration_version')!r}; esperado={expected_migration!r}")
          if str(payload.get('release_version', '')) != expected_release:
              failures.append(f"release={payload.get('release_version')!r}; esperado={expected_release!r}")
          for flag in required_flags:
              if flags.get(flag) is not True:
                  failures.append(f'{flag}=false')
          if failures:
              raise SystemExit('ERRO: coleta canônica incompatível. ' + '; '.join(failures))
          print(f'DATABASE_RELEASE_OK migration={expected_migration} release={expected_release}')
          PY

      - name: Consultar marcador da coleta assíncrona v8.8
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error \
            --request POST \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${SUPABASE_URL}/rest/v1/rpc/get_public_collection_async_release" \
            > "$response_file"
          python3 - "$response_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if isinstance(payload, list):
              payload = payload[0] if payload else {}
          if not isinstance(payload, dict):
              raise SystemExit('ERRO: marcador da coleta assíncrona retornou formato inválido.')
          expected_migration = os.environ['REQUIRED_ASYNC_COLLECTION_MIGRATION_VERSION']
          expected_release = os.environ['REQUIRED_ASYNC_COLLECTION_RELEASE_VERSION']
          flags = payload.get('schema_flags') or {}
          required_flags = (
              'collection_async_ingress_is_lightweight',
              'collection_async_private_credentials',
              'collection_async_vault_secrets',
              'collection_async_worker_rpcs',
              'collection_async_realtime',
              'collection_async_wakeup_trigger',
              'collection_async_fallback_cron',
              'collection_async_inbox_columns',
              'collection_async_session_lock_removed',
              'collection_event_payload_sanitizer',
              'collection_dashboard_state_cache',
              'collection_shift_kpis_direct_stage_index',
              'collection_async_worker_concurrency_bounded',
          )
          failures = []
          if payload.get('ready') is not True:
              failures.append('ready=false')
          if str(payload.get('migration_version', '')) != expected_migration:
              failures.append(f"migration={payload.get('migration_version')!r}; esperado={expected_migration!r}")
          if str(payload.get('release_version', '')) != expected_release:
              failures.append(f"release={payload.get('release_version')!r}; esperado={expected_release!r}")
          for flag in required_flags:
              if flags.get(flag) is not True:
                  failures.append(f'{flag}=false')
          if failures:
              raise SystemExit('ERRO: coleta assíncrona Supabase incompatível. ' + '; '.join(failures))
          print(f'ASYNC_COLLECTION_RELEASE_OK migration={expected_migration} release={expected_release}')
          PY

      - name: Consultar marcador da coleta assíncrona v8.9.1
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error \
            --request POST \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${SUPABASE_URL}/rest/v1/rpc/get_public_collection_sync_release" \
            > "$response_file"
          python3 - "$response_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if isinstance(payload, list):
              payload = payload[0] if payload else {}
          if not isinstance(payload, dict):
              raise SystemExit('ERRO: marcador assíncrono retornou formato inválido.')
          expected_migration = os.environ['REQUIRED_SYNC_MIGRATION_VERSION']
          expected_release = os.environ['REQUIRED_SYNC_RELEASE_VERSION']
          flags = payload.get('schema_flags') or {}
          required_flags = (
              'collection_async_inbox_columns',
              'collection_async_ingress_is_lightweight',
              'collection_async_private_credentials',
              'collection_async_worker_rpcs',
              'collection_async_session_lock_removed',
              'collection_async_realtime',
              'collection_async_wakeup_trigger',
              'collection_async_fallback_cron',
              'collection_async_vault_secrets',
              'collection_async_worker_concurrency_bounded',
              'collection_event_payload_sanitizer',
              'collection_dashboard_state_cache',
              'collection_sync_async_base_ready',
              'collection_sync_operator_kpis_event_ledger',
              'collection_sync_operator_covering_index',
              'collection_sync_manual_stage_index',
              'collection_sync_worker_claim_index',
              'collection_sync_worker_five_rounds',
              'collection_sync_fallback_five_seconds',
              'collection_sync_shift_window_constant_time',
          )
          failures = []
          if payload.get('ready') is not True:
              failures.append('ready=false')
          if str(payload.get('migration_version', '')) != expected_migration:
              failures.append(f"migration={payload.get('migration_version')!r}; esperado={expected_migration!r}")
          if str(payload.get('release_version', '')) != expected_release:
              failures.append(f"release={payload.get('release_version')!r}; esperado={expected_release!r}")
          for flag in required_flags:
              if flags.get(flag) is not True:
                  failures.append(f'{flag}=false')
          if failures:
              raise SystemExit('ERRO: coleta assíncrona incompatível. ' + '; '.join(failures))
          print(f'ASYNC_SYNC_RELEASE_OK migration={expected_migration} release={expected_release}')
          PY

  build:
    name: Gerar artefato do release comprovado
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [database-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Build de produção
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_BASE: /ac-prod/
          VITE_APP_COMMIT_SHA: ${{ github.sha }}
          VITE_APP_BUILD_TIME: ${{ github.run_started_at }}
        run: npm run build
      - name: Registrar versão publicada
        run: |
          cat > dist/build-info.json <<EOF
          {
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "migration_version": "${REQUIRED_MIGRATION_VERSION}",
            "release_version": "${REQUIRED_RELEASE_VERSION}",
            "collection_transport": "async",
            "collection_async_migration_version": "${REQUIRED_ASYNC_COLLECTION_MIGRATION_VERSION}",
            "collection_async_release_version": "${REQUIRED_ASYNC_COLLECTION_RELEASE_VERSION}",
            "sync_migration_version": "${REQUIRED_SYNC_MIGRATION_VERSION}",
            "sync_release_version": "${REQUIRED_SYNC_RELEASE_VERSION}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar GitHub Pages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
