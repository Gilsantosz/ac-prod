name: Dashboard single export menu
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/dashboard/ExportMenu*'
      - 'src/components/reports/ExportReportMenu*'
      - 'scripts/dashboard-export-menu-smoke.mjs'
      - '.github/workflows/dashboard-export-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/dashboard/ExportMenu*'
      - 'src/components/reports/ExportReportMenu*'
      - 'scripts/dashboard-export-menu-smoke.mjs'
      - '.github/workflows/dashboard-export-ci.yml'
permissions:
  contents: read
jobs:
  consolidated-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Targeted component tests
        run: npx vitest run src/components/dashboard/ExportMenu.test.jsx
      - name: Install Chromium
        run: npx playwright install --with-deps chromium > /tmp/dashboard-browser.log 2>&1 || { tail -60 /tmp/dashboard-browser.log; exit 1; }
      - name: Verify one button, responsive menu and both Excel downloads
        run: node scripts/dashboard-export-menu-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-export-menu-validation
          path: dashboard-export-artifacts/
          retention-days: 7
