name: MES isolated capacity 150 operators + 1000 management
on:
  push:
    branches: [test/k6-capacity-2026-09-07]
    paths: ['.github/workflows/k6-mes-1150.yml', 'scripts/capacity/mes-1150/**', 'tests/load/mes-1150.js']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: acprod-isolated-k6-capacity
  cancel-in-progress: false
jobs:
  investigation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Snapshot versioned sources for engineering review (no credentials)
        run: |
          set -euo pipefail
          mkdir -p artifacts/mes-1150
          git archive --format=tar HEAD > artifacts/mes-1150/source.tar
          git rev-parse HEAD > artifacts/mes-1150/source-sha.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mes-1150-sources-${{ github.run_id }}
          path: artifacts/mes-1150/
          retention-days: 2
