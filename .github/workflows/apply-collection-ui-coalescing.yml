name: Apply collection UI coalescing

on:
  push:
    branches:
      - fix/collection-async-worker-v8-7

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/collection-async-worker-v8-7
          fetch-depth: 0
      - name: Consolidar atualizações de UI e áudio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1. Coalescer estatísticas locais e notificações finais.
          hook_path = Path('src/hooks/useCollectionQueue.js')
          hook = hook_path.read_text(encoding='utf-8')

          hook = hook.replace(
              "const SERVER_QUERY_CHUNK = 100;\n",
              "const SERVER_QUERY_CHUNK = 100;\n"
              "const STATS_REFRESH_DEBOUNCE_MS = 80;\n"
              "const FINAL_NOTIFICATION_DEBOUNCE_MS = 80;\n",
              1,
          ) if 'STATS_REFRESH_DEBOUNCE_MS' not in hook else hook

          refs_anchor = """  const flushTimerRef = useRef(null);\n  const processFnRef = useRef(processFn);\n"""
          refs_replacement = """  const flushTimerRef = useRef(null);\n  const statsRefreshTimerRef = useRef(null);\n  const finalNotificationTimerRef = useRef(null);\n  const pendingFinalNotificationRef = useRef(null);\n  const processFnRef = useRef(processFn);\n"""
          if 'statsRefreshTimerRef' not in hook:
              if refs_anchor not in hook:
                  raise SystemExit('Refs do hook não localizadas')
              hook = hook.replace(refs_anchor, refs_replacement, 1)

          refresh_anchor = """  const refreshStatsSafely = useCallback(() => {\n    Promise.resolve(refreshStats()).catch((error) => {\n      console.warn('[CollectionQueue] Falha ao atualizar estatísticas locais:', error);\n    });\n  }, [refreshStats]);\n"""
          refresh_replacement = """  const refreshStatsSafely = useCallback((delayMs = STATS_REFRESH_DEBOUNCE_MS) => {\n    if (statsRefreshTimerRef.current) return;\n    statsRefreshTimerRef.current = setTimeout(() => {\n      statsRefreshTimerRef.current = null;\n      Promise.resolve(refreshStats()).catch((error) => {\n        console.warn('[CollectionQueue] Falha ao atualizar estatísticas locais:', error);\n      });\n    }, Math.max(0, Number(delayMs) || 0));\n  }, [refreshStats]);\n"""
          if 'delayMs = STATS_REFRESH_DEBOUNCE_MS' not in hook:
              if refresh_anchor not in hook:
                  raise SystemExit('refreshStatsSafely não localizado')
              hook = hook.replace(refresh_anchor, refresh_replacement, 1)

          notification_anchor = """  const handleBatchResult = useCallback((payload) => {\n    emitBatchResult(payload);\n    if (typeof onResultRef.current === 'function') {\n      onResultRef.current(payload);\n    } else {\n      notifyBatchResult(payload);\n    }\n  }, []);\n"""
          notification_replacement = """  const handleBatchResult = useCallback((payload) => {\n    emitBatchResult(payload);\n    if (typeof onResultRef.current === 'function') {\n      onResultRef.current(payload);\n      return;\n    }\n    if (payload?.result?.pending || payload?.result?.accepted) return;\n\n    pendingFinalNotificationRef.current = payload;\n    if (finalNotificationTimerRef.current) return;\n    finalNotificationTimerRef.current = setTimeout(() => {\n      finalNotificationTimerRef.current = null;\n      const latest = pendingFinalNotificationRef.current;\n      pendingFinalNotificationRef.current = null;\n      if (latest) notifyBatchResult(latest);\n    }, FINAL_NOTIFICATION_DEBOUNCE_MS);\n  }, []);\n"""
          if 'pendingFinalNotificationRef.current = payload' not in hook:
              if notification_anchor not in hook:
                  raise SystemExit('handleBatchResult não localizado')
              hook = hook.replace(notification_anchor, notification_replacement, 1)

          cleanup_anchor = """  useEffect(() => {\n    const handler = () => refreshStatsSafely();\n    window.addEventListener('collection-queue-changed', handler);\n"""
          cleanup_block = """  useEffect(() => () => {\n    if (statsRefreshTimerRef.current) {\n      clearTimeout(statsRefreshTimerRef.current);\n      statsRefreshTimerRef.current = null;\n    }\n    if (finalNotificationTimerRef.current) {\n      clearTimeout(finalNotificationTimerRef.current);\n      finalNotificationTimerRef.current = null;\n    }\n  }, []);\n\n  useEffect(() => {\n    const handler = () => refreshStatsSafely();\n    window.addEventListener('collection-queue-changed', handler);\n"""
          if 'finalNotificationTimerRef.current = null;' not in hook.split(cleanup_anchor)[0] if cleanup_anchor in hook else True:
              pass
          if 'useEffect(() => () => {\n    if (statsRefreshTimerRef.current)' not in hook:
              if cleanup_anchor not in hook:
                  raise SystemExit('Ponto de cleanup do hook não localizado')
              hook = hook.replace(cleanup_anchor, cleanup_block, 1)

          hook_path.write_text(hook, encoding='utf-8')

          # 2. Coalescer invalidações amplas e feedback de rajadas no painel.
          page_path = Path('src/pages/TraceabilityCollection.jsx')
          page = page_path.read_text(encoding='utf-8')
          page = page.replace(
              "import { useCallback, useEffect, useMemo, useState } from 'react';",
              "import { useCallback, useEffect, useMemo, useRef, useState } from 'react';",
              1,
          )

          refresh_anchor = """  const refreshData = useCallback(() => {\n    invalidateAllMesQueries(queryClient);\n    queryClient.invalidateQueries({ queryKey: ['stageReadings', cellName, machine?.id] });\n    setRefreshReadsSignal(prev => prev + 1);\n  }, [queryClient, cellName, machine]);\n"""
          refresh_replacement = """  const mesRefreshTimerRef = useRef(null);\n  const pendingAsyncFeedbackRef = useRef(null);\n  const asyncFeedbackTimerRef = useRef(null);\n\n  const refreshData = useCallback((delayMs = 150) => {\n    if (mesRefreshTimerRef.current) return;\n    mesRefreshTimerRef.current = setTimeout(() => {\n      mesRefreshTimerRef.current = null;\n      invalidateAllMesQueries(queryClient);\n      queryClient.invalidateQueries({\n        queryKey: ['stageReadings', cellName, machine?.id],\n      });\n      setRefreshReadsSignal((previous) => previous + 1);\n    }, Math.max(0, Number(delayMs) || 0));\n  }, [queryClient, cellName, machine?.id]);\n\n  useEffect(() => () => {\n    if (mesRefreshTimerRef.current) clearTimeout(mesRefreshTimerRef.current);\n    if (asyncFeedbackTimerRef.current) clearTimeout(asyncFeedbackTimerRef.current);\n  }, []);\n"""
          if 'mesRefreshTimerRef' not in page:
              if refresh_anchor not in page:
                  raise SystemExit('refreshData não localizado')
              page = page.replace(refresh_anchor, refresh_replacement, 1)

          page = page.replace(
              "    console.log('Subscribing to realtime collection events for parent KPIs in cell:', cellName);\n",
              "",
          )
          page = page.replace(
              "        console.log('Realtime collection event received in parent:', payload);\n",
              "",
          )
          page = page.replace(
              "      console.log('Unsubscribing from realtime collection events for parent cell:', cellName);\n",
              "",
          )

          listener_pattern = re.compile(
              r"  // A confirmação final chega depois do ACK do inbox, via Realtime/polling\.\n"
              r"  useEffect\(\(\) => \{.*?\n  \}, \[operator, refreshData, updateFeedback\]\);",
              re.S,
          )
          listener_replacement = """  // A confirmação final chega depois do ACK do inbox, via Realtime/polling.\n  // Rajadas são consolidadas para evitar centenas de renderizações e consultas.\n  useEffect(() => {\n    const applyAsyncCollectionResult = () => {\n      asyncFeedbackTimerRef.current = null;\n      const detail = pendingAsyncFeedbackRef.current;\n      pendingAsyncFeedbackRef.current = null;\n      const result = detail?.result;\n      if (!result) return;\n\n      updateFeedback({\n        ...result,\n        client_event_id: detail.event?.client_event_id || result.client_event_id,\n      });\n\n      if (result.item || result.reading || result.lot || result.order) {\n        const uid = detail.event?.raw_value || detail.event?.rawValue || '';\n        setSelectedPiece({\n          id: result.item?.id || result.reading?.piece_id || null,\n          piece_uid: uid,\n          piece_name: result.item?.name || result.item?.piece_name || 'Peça Lida',\n          lot_id: result.lot?.id || null,\n          lot_code: result.lot?.lot_code || 'LOTE-N/A',\n          order_number: result.order?.order_number || result.order?.order_code || 'N/A',\n          client_name: result.order?.customer_name || 'Cliente não informado',\n          current_stage: result.route?.step_name || result.item?.current_stage || result.item?.current_step,\n          current_stage_name: result.route?.step_name || result.item?.current_stage || result.item?.current_step,\n          operator_name: operator,\n          status: result.status || 'approved',\n          route: [],\n          completedSteps: [],\n        });\n      }\n\n      refreshData();\n    };\n\n    const handleAsyncCollectionResult = (browserEvent) => {\n      const detail = browserEvent?.detail || {};\n      const result = detail.result;\n      if (!detail.final || !result || result.pending) return;\n\n      const current = pendingAsyncFeedbackRef.current;\n      const currentPriority = current?.result?.success === false ? 2 : 1;\n      const nextPriority = result.success === false ? 2 : 1;\n      const currentTime = Date.parse(\n        current?.event?.created_at_client || current?.event?.createdAtClient || 0,\n      ) || 0;\n      const nextTime = Date.parse(\n        detail?.event?.created_at_client || detail?.event?.createdAtClient || 0,\n      ) || 0;\n\n      if (!current || nextPriority > currentPriority || (\n        nextPriority === currentPriority && nextTime >= currentTime\n      )) {\n        pendingAsyncFeedbackRef.current = detail;\n      }\n\n      if (asyncFeedbackTimerRef.current) return;\n      asyncFeedbackTimerRef.current = setTimeout(\n        applyAsyncCollectionResult,\n        80,\n      );\n    };\n\n    window.addEventListener('collection-batch-result', handleAsyncCollectionResult);\n    return () => {\n      window.removeEventListener('collection-batch-result', handleAsyncCollectionResult);\n      if (asyncFeedbackTimerRef.current) {\n        clearTimeout(asyncFeedbackTimerRef.current);\n        asyncFeedbackTimerRef.current = null;\n      }\n    };\n  }, [operator, refreshData, updateFeedback]);"""
          if 'Rajadas são consolidadas' not in page:
              page, count = listener_pattern.subn(listener_replacement, page, count=1)
              if count != 1:
                  raise SystemExit('Listener assíncrono não localizado')

          page_path.write_text(page, encoding='utf-8')

          # 3. Não criar um AudioContext por ACK e reutilizar o contexto final.
          scanner_path = Path('src/components/traceability/TraceabilityScannerPanel.jsx')
          scanner = scanner_path.read_text(encoding='utf-8')
          scanner = scanner.replace(
              "  const mountedRef = useRef(true);\n",
              "  const mountedRef = useRef(true);\n  const audioContextRef = useRef(null);\n",
              1,
          ) if 'audioContextRef' not in scanner else scanner

          cleanup_anchor = """  useEffect(() => () => {\n    mountedRef.current = false;\n  }, []);\n"""
          cleanup_replacement = """  useEffect(() => () => {\n    mountedRef.current = false;\n    const context = audioContextRef.current;\n    audioContextRef.current = null;\n    if (context && typeof context.close === 'function') {\n      Promise.resolve(context.close()).catch(() => undefined);\n    }\n  }, []);\n"""
          if 'Promise.resolve(context.close())' not in scanner:
              if cleanup_anchor not in scanner:
                  raise SystemExit('Cleanup do scanner não localizado')
              scanner = scanner.replace(cleanup_anchor, cleanup_replacement, 1)

          audio_pattern = re.compile(
              r"  useEffect\(\(\) => \{\n    if \(!feedback\) return;\n\n    const playSound.*?\n  \}, \[feedback\]\);",
              re.S,
          )
          audio_replacement = """  useEffect(() => {\n    // ACK azul apenas confirma transporte; o bip é reservado à decisão final.\n    if (\n      !feedback\n      || feedback.pending\n      || feedback.accepted\n      || feedback.alert_level === 'blue'\n    ) return;\n\n    const playSound = (alertLevel) => {\n      try {\n        const AudioCtx = window.AudioContext || window.webkitAudioContext;\n        if (!AudioCtx) return;\n        let ctx = audioContextRef.current;\n        if (!ctx || ctx.state === 'closed') {\n          ctx = new AudioCtx();\n          audioContextRef.current = ctx;\n        }\n        if (ctx.state === 'suspended') {\n          Promise.resolve(ctx.resume()).catch(() => undefined);\n        }\n\n        const osc = ctx.createOscillator();\n        const gain = ctx.createGain();\n        osc.connect(gain);\n        gain.connect(ctx.destination);\n\n        if (alertLevel === 'green') {\n          osc.type = 'sine';\n          osc.frequency.setValueAtTime(880, ctx.currentTime);\n          gain.gain.setValueAtTime(0.1, ctx.currentTime);\n          gain.gain.exponentialRampToValueAtTime(\n            0.01,\n            ctx.currentTime + 0.12,\n          );\n          osc.start();\n          osc.stop(ctx.currentTime + 0.12);\n        } else {\n          osc.type = 'triangle';\n          osc.frequency.setValueAtTime(659.25, ctx.currentTime);\n          gain.gain.setValueAtTime(0.08, ctx.currentTime);\n          gain.gain.exponentialRampToValueAtTime(\n            0.01,\n            ctx.currentTime + 0.35,\n          );\n          osc.start();\n          osc.stop(ctx.currentTime + 0.35);\n        }\n      } catch (error) {\n        console.error('Falha na execução do áudio de bip:', error);\n      }\n    };\n\n    const level = feedback.alert_level || (feedback.success ? 'green' : 'red');\n    playSound(level);\n  }, [feedback]);"""
          if 'ACK azul apenas confirma transporte' not in scanner:
              scanner, count = audio_pattern.subn(audio_replacement, scanner, count=1)
              if count != 1:
                  raise SystemExit('Bloco de áudio não localizado')

          scanner_path.write_text(scanner, encoding='utf-8')
          PY
      - name: Publicar otimização
        run: |
          if git diff --quiet; then
            echo "COALESCING_ALREADY_APPLIED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/hooks/useCollectionQueue.js \
            src/pages/TraceabilityCollection.jsx \
            src/components/traceability/TraceabilityScannerPanel.jsx
          git commit -m "perf(collection): consolida atualizações de UI em rajadas"
          git push origin HEAD:fix/collection-async-worker-v8-7
